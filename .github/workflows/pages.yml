name: Deploy to GitHub Pages
on:
  push: {branches: [main]}
  release: {types: [published]}
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from the latest release
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ github.event.release.tag_name }}'}
        run: |
          VER="$TAG"
          [ -n "$VER" ] || VER=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          VER="${VER#v}"; VER="${VER#V}"
          [ -n "$VER" ] || VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> "$GITHUB_ENV"
          grep -rl 'class="appver"' www | xargs -r sed -i -E "s#<span class=\"appver\">[^<]*</span>#<span class=\"appver\">$VER</span>#g"
          echo "App version: $VER"; grep -rho '<span class="appver">[^<]*</span>' www | head -1
          sed -i -E "s/^const VERSION = '[^']*'/const VERSION = 'rawd-$VER'/; s/^const C='[^']*'/const C='mushaf-$VER-${GITHUB_SHA::7}'/" www/sw.js
          head -c 160 www/sw.js; echo
      - name: Publish www to the gh-pages branch (no artifacts)
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} (v$VER)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages"
